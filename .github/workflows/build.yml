name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "CodePad-v${{ github.run_number }}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" "CodePad-v${{ github.run_number }}.apk" --title "CodePad v${{ github.run_number }}" --notes "Release build, signed with the CodePad key."
